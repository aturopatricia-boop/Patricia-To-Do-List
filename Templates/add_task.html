<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Add Task - Patricia's To-Do List</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >

</head>


<body>

    <!-- HEADER -->

    <header>

        <h1>🌸 Add a New Task</h1>

        <p>
            Create a reminder for your daily activities.
        </p>

    </header>


    <!-- MAIN CONTENT -->

    <div class="container">

        <form method="POST" action="/add-task">

            <!-- TASK NAME -->

            <label>
                <strong>Task Name:</strong>
            </label>

            <input
                type="text"
                name="title"
                placeholder="e.g. Wake up and pray"
                required
            >


            <!-- DESCRIPTION -->

            <label>
                <strong>Description:</strong>
            </label>

            <textarea
                name="description"
                rows="4"
                placeholder="Enter details about the task"
            ></textarea>


            <!-- DATE -->

            <label>
                <strong>📅 Date:</strong>
            </label>

            <input
                type="date"
                name="task_date"
                required
            >


            <!-- TIME -->

            <label>
                <strong>⏰ Time:</strong>
            </label>

            <div>

                <!-- HOUR -->

                <select name="task_hour" required>

                    <option value="" selected disabled>
                        Select hour
                    </option>

                    {% for hour in range(1, 13) %}

                        <option value="{{ hour }}">
                            {{ hour }}
                        </option>

                    {% endfor %}

                </select>


                <!-- MINUTE -->

                <select name="task_minute" required>

                    <option value="" selected disabled>
                        Select minute
                    </option>

                    {% for minute in range(0, 60) %}

                        <option value="{{ minute }}">
                            {{ "%02d"|format(minute) }}
                        </option>

                    {% endfor %}

                </select>


                <!-- AM / PM -->

                <select name="task_period" required>

                    <option value="" selected disabled>
                        Select AM/PM
                    </option>

                    <option value="AM">
                        AM
                    </option>

                    <option value="PM">
                        PM
                    </option>

                </select>

            </div>


            <!-- REPEAT -->

            <label>
                <strong>🔁 Repeat:</strong>
            </label>

            <select
                name="repeat_type"
                required
            >

                <option value="none">
                    Once
                </option>

                <option value="daily">
                    Daily
                </option>

                <option value="weekly">
                    Weekly
                </option>

                <option value="monthly">
                    Monthly
                </option>

            </select>


            <!-- REMINDER -->

            <label>

                <input
                    type="checkbox"
                    name="reminder_enabled"
                    checked
                >

                🔔 Enable Reminder

            </label>


            <!-- MUSIC -->

            <label>

                <input
                    type="checkbox"
                    name="music_enabled"
                    checked
                >

                🎵 Play Background Music

            </label>


            <!-- SAVE BUTTON -->

            <button type="submit">

                💾 Save Task

            </button>

        </form>


        <br>


        <!-- BACK TO DASHBOARD -->

        <a href="/">
            ← Back to Dashboard
        </a>

    </div>

</body>

</html>
